services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-platform-postgres
    environment:
      POSTGRES_DB: dev_platform
      POSTGRES_USER: dev_platform
      POSTGRES_PASSWORD: dev_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dev-platform-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: dev-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devplatform
      MINIO_ROOT_PASSWORD: devplatform123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
